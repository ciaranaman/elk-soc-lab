input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
    additional_codecs => { "application/json" => "json" }
    ecs_compatibility => "v8"
  }
}
filter {
  if ![event][id] or ![event][category] or ![event][outcome] {
    mutate { add_tag => ["invalid_security_event"] }
  }
  if [event][category] == "authentication" and [event][outcome] == "failure" {
    mutate { add_tag => ["authentication_failure"] }
  }
  if [process][name] == "powershell.exe" and [process][command_line] =~ /(?i)-(enc|encodedcommand)\b/ {
    mutate { add_tag => ["encoded_powershell_candidate"] }
  }
}
output {
  if "invalid_security_event" in [tags] or "_jsonparsefailure" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "soc-quarantine"
      ilm_enabled => false
      data_stream => false
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "soc-lab"
      document_id => "%{[event][id]}"
      ilm_enabled => false
      data_stream => false
    }
  }
}
